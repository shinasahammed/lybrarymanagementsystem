<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>logout</title>
</head>
<body>
    <h2>Are you sure you want to log out {{ request.user.first_name }}</h2>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Log Out</button>
    </form>
    <a href="{% url 'dashboard' %}">Cancel</a>
</body>
</html>
