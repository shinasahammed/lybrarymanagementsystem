<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Profile</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }

        .profile-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            padding: 40px;
            width: 400px;
            text-align: center;
            animation: floatIn 1s ease-out;
        }

        @keyframes floatIn {
            from {transform: translateY(50px);opacity: 0;}
            to {transform: translateY(0);opacity: 1;}
        }

        h2 {
            color: #333;
            margin-bottom: 20px;
        }

        h3 {
            color: #2575fc;
            margin-bottom: 10px;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }

        input, textarea, select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            width: 100%;
            font-size: 14px;
        }

        button {
            background: #2575fc;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }

        button:hover {
            background: #6a11cb;
        }

        hr {
            border: none;
            height: 1px;
            background: #ddd;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="profile-container">
        <h2>My Profile</h2>

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <h3>Edit Profile</h3>
            {{ profile_form.as_p }}
            <button type="submit" name="update_profile">Save Changes</button>
        </form>

        <hr>

        <form method="post">
            {% csrf_token %}
            <h3>Change Password</h3>
            {{ password_form.as_p }}
            <button type="submit" name="change_password">Change Password</button>
        </form>
    </div>
</body>
</html>
