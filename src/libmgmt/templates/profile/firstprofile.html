<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Profile</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }

        .profile-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            padding: 40px;
            width: 350px;
            text-align: center;
            animation: floatIn 1s ease-out;
        }

        @keyframes floatIn {
            from {transform: translateY(50px);opacity: 0;}
            to {transform: translateY(0);opacity: 1;}
        }

        .profile-image {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #2575fc;
            margin-bottom: 15px;
        }

        h2 {color: #333;margin-bottom: 15px;}

        form {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 15px;
        }

        input, textarea, select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            width: 100%;
            font-size: 14px;
        }

        button, .btn-link {
            background: #2575fc;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            text-decoration: none;
            display: block;
            text-align: center;
            transition: background 0.3s;
        }

        button:hover, .btn-link:hover {
            background: #6a11cb;
        }
    </style>
</head>
<body>
    <div class="profile-container">
        <h2>Your Profile</h2>

        {% if user.image %}
            <img src="{{ user.image.url }}" alt="Profile Photo" class="profile-image">
        {% else %}
            <img src="https://via.placeholder.com/120" alt="Default Photo" class="profile-image">
        {% endif %}

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Save</button>
        </form>

        <a href="{% url 'profile' %}" class="btn-link">Edit Password</a>
    </div>
</body>
</html>
