<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Library Sign in</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Roboto+Slab:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* Base Styling */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(to bottom, #a1c4fd, #c2e9fb);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }

        /* Card container */
        .register-card {
            background: #fff;
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            transform-style: preserve-3d;
            transition: transform 0.6s;
            position: relative;
        }

        /* 3D hover effect */
        .register-card:hover {
            transform: rotateY(10deg) rotateX(5deg) scale(1.05);
        }

        /* Header */
        .register-card h2 {
            font-family: 'Roboto Slab', serif;
            color: #34495e;
            margin-bottom: 30px;
            text-align: center;
        }

        /* Form styling */
        form input {
            width: 100%;
            padding: 12px 15px;
            margin: 10px 0;
            border-radius: 10px;
            border: 1px solid #ccc;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        form input:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 10px rgba(13,110,253,0.3);
            outline: none;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #6a11cb, #2575fc);
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        button:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        /* Login link */
        .login-link {
            text-align: center;
            margin-top: 20px;
        }
        .login-link a {
            color: #2575fc;
            font-weight: 500;
            text-decoration: none;
            transition: color 0.3s ease;
        }
        .login-link a:hover {
            color: #6a11cb;
        }

        /* Messages styling */
        .alert {
            border-radius: 10px;
            margin-bottom: 15px;
        }

        /* Animated books in background */
        .book {
            width: 40px;
            height: 50px;
            background: #ffdd59;
            position: absolute;
            transform-style: preserve-3d;
            animation: float 8s infinite ease-in-out;
        }

        .book:nth-child(1) { top: 10%; left: 5%; animation-delay: 0s; }
        .book:nth-child(2) { top: 70%; left: 20%; animation-delay: 2s; }
        .book:nth-child(3) { top: 40%; left: 80%; animation-delay: 4s; }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotateY(0deg); }
            50% { transform: translateY(-20px) rotateY(180deg); }
        }
    </style>
</head>
<body>

    <!-- Animated books -->
    <div class="book"></div>
    <div class="book"></div>
    <div class="book"></div>

    <!-- Sign Up Card -->
    <div class="register-card">
        <h2>Login Your Account</h2>


        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Sign Up</button>
        </form>

        <div class="login-link">
            create a new account? <a href="{% url 'signup' %}">register</a>
        </div>
    </div>

</body>
</html>
