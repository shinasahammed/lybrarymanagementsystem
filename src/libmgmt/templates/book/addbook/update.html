<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Update Book</title>
    <style>
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #e0f7fa, #80deea);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 200px;
        }
        .container {
            background: #fff;
            padding: 40px 50px;
            border-radius: 16px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.1);
            width: 420px;
        }
        h1 {
            text-align: center;
            color: #00796b;
            margin-bottom: 25px;
        }
        label {
            font-weight: 600;
            color: #333;
            display: block;
            margin-bottom: 6px;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            transition: 0.3s;
        }
        input:focus, textarea:focus, select:focus {
            border-color: #00796b;
            box-shadow: 0 0 5px rgba(0,121,107,0.3);
            outline: none;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #00796b;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background: #004d40;
        }
        a {
            display: inline-block;
            text-align: center;
            width: 100%;
            margin-top: 15px;
            color: #00796b;
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s;
        }
        a:hover {
            color: #004d40;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Update Book</h1>
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Save</button>
        </form>
        <a href="{% url 'booklist' %}">Cancel</a>
    </div>
</body>
</html>
